[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = { version = "4.18.2", features = ["cookies"] }
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
env_logger = "0.11.11"
getrandom = "0.4"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }
log = "0.4.35"
pulldown-cmark = { version = "0.13.6", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["charset", "form", "http2", "json", "query", "rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "json", "migrate", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "sync", "time"] }
url = "2.5.8"
