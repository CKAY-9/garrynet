# Demo deployment (docs/DEMO.md): GravNet with demo mode on. Stripe only takes test keys,
# and everything users without Admin Access create is cleared daily at midnight UTC.
#
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml up -d --build
#
# Needs the same setup as docker-compose.yml (SITE_DOMAIN and API_DOMAIN in the root `.env`,
# backend/.env and frontend/.env set up for those domains). Run it from its own clone: the
# .env files and ports 80/443 can't be shared with another deployment on the same machine.

services:
  backend:
    environment:
      DEMO_MODE: "true"
