# GarryNet: Postgres + backend + frontend.
#
# Each service reads its own `.env` (backend/.env, frontend/.env) when present.
# The values below are overridden because they only make sense inside the
# compose network. Everything else (BACKEND_URL, FRONTEND_URL, JWT_SECRET,
# STEAM_API_KEY, ...) comes from the .env files.
#
# Optional: a root `.env` can set POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB
# and the published ports BACKEND_PORT / FRONTEND_PORT.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-garrynet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-garrynet}
      POSTGRES_DB: ${POSTGRES_DB:-garrynet}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    # Keep stdin open with a terminal so the backend's interactive admin shell works:
    # `docker compose attach backend`, then detach with Ctrl+P Ctrl+Q (Ctrl+C stops the backend).
    stdin_open: true
    tty: true
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      BIND_ADDR: 0.0.0.0:8080
      DATABASE_URL: postgres://${POSTGRES_USER:-garrynet}:${POSTGRES_PASSWORD:-garrynet}@db:5432/${POSTGRES_DB:-garrynet}
    volumes:
      # Uploaded files (local storage provider). Unused with STORAGE_PROVIDER=s3.
      - uploads:/app/storage
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build: ./frontend
    restart: unless-stopped
    env_file:
      - path: ./frontend/.env
        required: false
    environment:
      # Server-to-server calls go over the compose network. The browser keeps
      # using NEXT_PUBLIC_API_URL from frontend/.env.
      API_URL: http://backend:8080
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  db-data:
  uploads:
