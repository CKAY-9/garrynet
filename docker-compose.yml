# GravNet: Postgres + backend + frontend, behind Caddy (HTTPS, security headers and a
# per-IP rate limit; see Caddyfile).
#
# Each service reads its own `.env` (backend/.env, frontend/.env) when present.
# The values below are overridden because they only make sense inside the
# compose network. Everything else (BACKEND_URL, FRONTEND_URL, JWT_SECRET,
# STEAM_API_KEY, ...) comes from the .env files.
#
# The root `.env` must set SITE_DOMAIN and API_DOMAIN, and can set POSTGRES_USER /
# POSTGRES_PASSWORD / POSTGRES_DB and the RATE_LIMIT_* settings (see .env.example).
# Only Caddy publishes ports (80 and 443): the frontend and backend are reached through it,
# so the rate limit can't be bypassed.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gravnet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gravnet}
      POSTGRES_DB: ${POSTGRES_DB:-gravnet}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    # Keep stdin open with a terminal so the backend's interactive admin shell works:
    # `docker compose attach backend`, then detach with Ctrl+P Ctrl+Q (Ctrl+C stops the backend).
    stdin_open: true
    tty: true
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      BIND_ADDR: 0.0.0.0:8080
      DATABASE_URL: postgres://${POSTGRES_USER:-gravnet}:${POSTGRES_PASSWORD:-gravnet}@db:5432/${POSTGRES_DB:-gravnet}
    volumes:
      # Uploaded files (local storage provider). Unused with STORAGE_PROVIDER=s3.
      - uploads:/app/storage
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    env_file:
      - path: ./frontend/.env
        required: false
    environment:
      # Server-to-server calls go over the compose network. The browser keeps
      # using NEXT_PUBLIC_API_URL from frontend/.env.
      API_URL: http://backend:8080
    depends_on:
      - backend

  caddy:
    build: ./caddy
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN in .env (e.g. gnet.example.com)}
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env (e.g. api.gnet.example.com)}
      RATE_LIMIT_EVENTS: ${RATE_LIMIT_EVENTS:-600}
      RATE_LIMIT_GNET_EVENTS: ${RATE_LIMIT_GNET_EVENTS:-1200}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-1m}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates: keep them, or every restart asks Let's Encrypt for new ones.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
      - backend

volumes:
  db-data:
  uploads:
  caddy-data:
  caddy-config:
